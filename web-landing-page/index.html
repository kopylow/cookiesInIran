<section class="chapter" data-tense="past">
<h1>Who you gonna call?</h1>
<p>Meine Reise begann vor einiger Zeit in einem Auto, das man so auf den Straßen nicht alle Tage sieht: ein Mercedes W124, Baujahr 1993, ehemaliges Notarztfahrzeug. Mit seinem markanten Aufbau sieht er ein bisschen aus wie der Wagen der Ghostbusters. Und genau so fühlte es sich auch an: wie ein Abenteuer, bei dem man nie genau weiß, welches „Gespenst“ hinter der nächsten Kurve wartet. Der W124 war mein mobiles Zuhause, ein treuer Panzer aus Stahl, der mich durch verschiedenste Kulturen und Landschaften trug.</p>
<p>Doch kein Land auf dieser Reise hat mich emotional so begeistert und gleichzeitig herausgefordert wie der Iran.</p>
<p>Was ich hier erzähle, ist nur ein Bruchteil meiner Erlebnisse dort. Es ist die Geschichte des wohl abenteuerlichsten und zugleich nervenaufreibendsten Monats meines Lebens. Es war eine Zeit, in der die unendliche Hilfsbereitschaft der Menschen direkt auf die unnachgiebige Härte eines gnadenlosen Systems prallte.</p>
<p>Ich weiß, die unten stehenden Zeilen sehen nach viel aus, aber bitte lest sie bis zum Schluss. Ich kann euch versprechen: Es wird sich lohnen. Ihr werdet verstehen, wie eine einfache Schachtel Kekse in einem unbarmherzigen System plötzlich über Freiheit und Schicksal entscheiden kann.</p>
</section>
<section class="chapter" data-tense="present">
<h1>Gehe nicht über Los</h1>
<p>Mein Pass ist zu diesem Zeitpunkt schon seit fast einer Woche weg. Ich sitze im Ungewissen, aber ich bleibe ruhig. Normalerweise bin ich ein optimistischer Mensch; ich löse Probleme, wenn sie auftauchen, anstatt mich von ihnen überwältigen zu lassen. Also gehen Payam und ich unvoreingenommen in das Gerichtsgebäude. „Das wird schon“, denke ich mir.</p>
<p>Es ist bereits mein zweiter Besuch dort, aber dazu später mehr.</p>
<p>Wir betreten das Zimmer des bis ins kleinste Detail geschniegelten Gerichtsassistenten. Ein kurzer Wortwechsel, dann das Signal: Der Richter hat Zeit für uns. Wir wechseln in das Richterzimmer. Der Raum ist trist: ein einfacher Holztisch, an dem der Richter thront, und drumherum Metallstühle mit Ledersitzen, die scheinbar schon seit einigen Jahren in ihrer originalen Plastikverpackung hier stehen. Bloß keinen Verschleiß riskieren, sicher ist sicher. Ich nehme an der Seite Platz, während Payam dem Richter direkt gegenüber sitzt.</p>
<p>Die Stimmung im Raum ist bedrückend. Payam hat eigentlich immer diesen freundlichen, entspannten Blick in den Augen, der einem sofort Vertrauen einflößt. Doch während die beiden sprechen, beobachte ich, wie dieser Blick sich wandelt. Er wird ernst, dann tief besorgt. Ich verstehe kein einziges Wort des persischen Dialogs, aber das Unbehagen kriecht mir langsam den Rücken hoch. Das Gespräch dauert kaum zwei Minuten, doch sie fühlen sich an wie eine Ewigkeit.</p>
<p>Als wir das Zimmer verlassen, herrscht erst einmal Stille. Payam sucht nach Worten. Wahrscheinlich wird ihm in diesem Moment klar, dass es für das, was er mir sagen muss, keine „richtige“ Formulierung gibt.</p>
<p>„Anton“, sagt er schließlich schwerfällig, „sie werfen dir vor, dein Auto in den Iran geschmuggelt zu haben. Wir müssen in zwei Tagen wiederkommen. Mit einer Kaution von 48.000 $. Wenn wir das Geld nicht haben, gehst du ins Gefängnis.“</p>
<p>Ich sehe ihn an und frage nur: „Ist das dein Ernst oder machst du Witze?“</p>
<p>Er sieht mich an und bestätigt, dass das kein Witz ist.</p>
<p>48.000$. Eine Summe völlig jenseits meiner Realität. In meinem Kopf ploppt nur ein einziger, absurder Gedanke auf: Gehe nicht über Los. Ziehe keine 4000$ ein.</p>
<p>Geil!</p>
<p>Wir gehen schweigend zum Auto und fahren los.</p>
</section>
<section class="chapter" data-tense="past">
<h1>Zwischen Raketen und rotem Sand</h1>
<p>Nach drei Monaten Thailand-Aufenthalt kam ich Ende Februar 2025 zurück nach Tiflis, der Hauptstadt Georgiens. Ich holte Keti aus Armenien ab, die ich bereits aus Südostasien kannte, und wir verbrachten einige Zeit in Georgien, bis wir die nötigen Dokumente zusammen hatten. Die Visa für den Iran waren problemlos sehr schnell ausgestellt. Die Ankunft des Carnet de Passage ließ allerdings auf sich warten. Dieses Dokument ist einem Reisepass ähnlich, bloß nicht für Menschen, sondern für Autos. Um ein solches zu bekommen, muss man abhängig vom Wert des Autos ein Deposit hinterlegen. In meinem Fall waren es 5.000 Euro.</p>
<p>Als das Carnet endlich da war, entschieden wir uns, recht zügig Richtung Iran zu fahren, da ich unbedingt die Nowruz-Feierlichkeiten miterleben wollte. So machten wir uns auf den Weg durch Armeniens atemberaubende Berglandschaften und kamen am 17. März im Iran an. An der Grenze wurde schnell klar, dass es nicht wirklich organisiert war. Das Carnet wurde bereits gestempelt, aber ich sollte noch zu einem Herrn in einen Container. Er telefonierte herum, schien aber nicht die nötige Information zu bekommen, wirkte dabei jedoch sehr entspannt und gleichgültig und ließ mich schließlich einfach gehen.</p>
<p>Mittlerweile ist mir bewusst, was sein Problem war: Laut Gesetz ist er eigentlich dazu verpflichtet, mir ein Ausreisedatum für das Auto zu geben. Ihm war scheinbar nicht bewusst, wann das ist. Mir persönlich natürlich auch nicht. Allgemein ist es nur sehr schwer, als Ausländer rechtliche Informationen aus dem Iran zu beziehen. Das liegt nicht nur an der Sprachbarriere, sondern auch daran, dass sämtliche iranische Webseiten nur aus dem Iran verfügbar sind. In diesem Moment verstand ich nicht, was genau das Problem dieses Mannes war. Es war mir auch egal; ich war froh, dass er uns einfach fahren ließ.</p>
<p>Der Iran war aufregend und anders als alles andere, wo ich bisher war. Wir fuhren in den nächsten Wochen über Tabriz, Rascht, Teheran und Isfahan nach Shiraz. Nach circa einem Monat gemeinsamer Reise musste Keti wieder abreisen. Ich führte meine Tour allein fort und verbrachte einen weiteren Monat im Süden des Landes. Da der Liter Benzin gerade mal 2 Cent kostet, nutzte ich das natürlich aus und besuchte zahlreiche Orte und Inseln. Meine absolute Empfehlung ist die Insel Hormuz. Ich habe so eine Art Natur noch nie gesehen: Vom Boden aus gelbem Kristallgestein über tiefroten bis hin zu funkelndem schwarzen Sand hat diese Insel wirklich viel zu bieten.</p>
<p>Von Hormuz ging es für mich zurück auf die Insel Qeshm, wo ich Alen kennenlernte. Er ist ein schlanker, langgewachsener Kroate mit Bart und einem freundlichen Lächeln, der mit seinem VW T4 bereits seit über neun Jahren reiste. Er war auf der Insel gestrandet, weil er ein größeres Problem mit seinem Wagen hatte. Da ich zuvor zwei Monate lang gar keinen Alkohol getrunken hatte, kam mir die Abwechslung gelegen: Alen hatte eine Connection zu einem Arak-Händler. Wir tranken den selbstgebrannten Schnaps zusammen und redeten über unsere Pläne. Alen erwähnte, dass er bereits vorher zwei Mal seinen Van über einen längeren Zeitraum im Iran gelassen hatte. Es sei kein Problem, solange das Carnet noch gültig sei. Rückblickend betrachtet ist die Lektion klar: Traue keinem betrunkenen Kroaten, wenn es um komplexe gesetzliche Bestimmungen geht. Zu diesem Zeitpunkt machte ich mir jedoch keinerlei Gedanken dazu, da ich auf dem Weg nach Nepal war.</p>
<p>Am 7. Mai war es für uns soweit, die Insel zu verlassen. Mit einem Abschleppseil zog ich Alens T4 Richtung Fähre. Wir fuhren in der sengenden Hitze bei 40 Grad mit 30 km/h über die Straßen. Mein W124 hat keine Klimaanlage, woran ich mich bei diesen Temperaturen zwar gewöhnt hatte, was die Fahrt aber nicht gerade entspannter machte. Auf der Fähre saßen wir mit den Mitarbeitern zusammen und tranken Tee. Ich erzählte, dass ich auf dem Weg über Pakistan und Indien nach Nepal sei. Einer der Männer machte mit seinen Händen Raketenbewegungen von Indien nach Pakistan. Ich dachte, er meinte die Scharmützel im Kaschmir-Konflikt, die mal wieder am Eskalieren waren und ging davon aus, dass diese sich wie auch vorher schon beruhigen würden.</p>
<p>Ich lag falsch. Als wir am Festland ankamen, schaute ich in die Nachrichten. Dort stand es schwarz auf weiß: Indien hatte an diesem Tag Pakistan mit Raketen angriffen. Das war eine deutlich größere Sache als die paar kleinen Scharmützel vorher. Mir wurde bewusst, dass die Grenze zwischen Indien und Pakistan geschlossen bleiben würde. Mein Plan ging nicht auf. Ich beschloss, einen kühlen Kopf zu behalten, und buchte mir ein Hotelzimmer in Bandar Abbas, um online zu recherchieren. Dort fand ich in zahlreichen Reiseforen und Blogs Bestätigungen für Alens Aussage. Es gab nun zwei Möglichkeiten: entweder fahre ich über Pakistan nach Afghanistan und weiter Richtung Tadschikistan oder ich lasse den Wagen im Iran und fliege zurück nach Südostasien. Letzteres wirkte deutlich attraktiver, als mich in Afghanistan mit den Taliban rumzuärgern. Ich beschloss, eine Nacht darüber zu schlafen. Am nächsten Morgen buchte ich mein Ticket für den 12. Mai von Shiraz nach Bangkok und machte mich auf den Weg nach Shiraz.</p>
<p>Dort angekommen lernte ich Razool kennen, Alens Mechaniker. Razool ist ein ungemein netter Mann mit leuchtenden Augen und einer sehr positiven Ausstrahlung, dessen Herz für VWs schlägt. Er bot mir an, meinen Wagen bei ihm auf seinem privaten Grundstück zu parken. Es wirkte auf mich wie die beste Option und ich nahm das Angebot dankend an.</p>
<p>An meinem Abreisetag am 12. Mai gab es jedoch noch ein unerwartetes Hindernis. In der großen Hitze der letzten Wochen war es mir egal geworden, dass man wegen der Scharia eigentlich keine kurzen Hosen tragen sollte. Für Ausländer gelten im Iran allgmein etwas andere Gesetze. Da ich nach Bangkok flog, hatte ich keine einzige lange Hose dabei. Am Flughafen sagte mir ein Beamter, ich könne so nicht fliegen. Er durchsuchte mein Gepäck, fand aber natürlich nichts. Ich schlug ihm vor, mein großes Decathlon-Handtuch wie einen Rock über die Beine zu binden. Er stimmte zu. So saß ich mit meinem umgebundenen Handtuch in der Wartehalle und bestieg schließlich das Flugzeug.</p>
</section>
<section class="chapter" data-tense="past">
<h1>Zwischen den Welten</h1>
<p>Die folgenden Monate verbrachte ich in Thailand, Laos, Vietnam, China und Japan. Ich war weit weg von den bürokratischen Hürden des Nahen Ostens. Während ich diese Länder bereiste, stand mein Mercedes weiterhin sicher geglaubt in Shiraz auf einem privaten Grundstück. Doch die geopolitische Lage im Iran änderte sich im Juni 2025 schlagartig durch den 12 Tage Krieg. Schwere Luftangriffe durch Israel und die USA trafen das Land. Mitten in dieser Zeit der Instabilität meldete sich Razool bei mir. Er bat um Fotos meines Reisepasses und des Carnet de Passage. Er begründete dies damit, dass die Polizei nachfragen könne. Wie ich später erfuhr, hatte Razool sich beim iranischen Geheimdienst gemeldet, weil mein ausländisches Fahrzeug auf seinem Grundstück geparkt war. In einer Zeit höchster militärischer Paranoia war der Wagen für die Behörden so zumindest offiziell bekannt und nicht versteckt.</p>
<p>Parallel dazu änderte sich auch die Situation für Alen. Er hatte seinen T4 ebenfalls im Iran zurücklassen müssen, da eine Reparatur vor Ort nicht möglich war. Er informierte mich darüber, dass das Zurücklassen des Fahrzeugs entgegen seiner ersten Vermutung doch zu massiven Problemen führen könnte. Alen selbst hatte bei seiner Fristüberschreitung, die parallel zu meiner verlief, sehr viel Glück gehabt und lediglich etwa 70 Euro bezahlt. Ich begann daraufhin selbst intensiver zu recherchieren. Ich stieß auf Berichte, nach denen eine Geldstrafe von etwa 1000 Euro für die Zeitüberschreitung fällig würde. Für mich war das ein kalkulierbares Risiko und eher eine hohe Gebühr für meine gewonnene Reisefreiheit in Südostasien.</p>
<p>Da ich wegen der Fristüberschreitung ohnehin schon in der rechtlichen Klemme steckte, sah ich keinen Grund für eine überstürzte Rückkehr. Ich entschied mich zu warten, bis sich die militärische Lage im Land etwas beruhigt hatte. Kurz vor meiner geplanten Rückreise gab es noch einmal Kontakt zu Razool. Er half mir dabei, die Lichtmaschine an meinem Mercedes zu reparieren, damit der Wagen für die kommende Fahrt einsatzbereit war. Am 30. Dezember 2025 landete ich schließlich am Imam Khomeini Flughafen in Teheran. Die Einreise verlief ohne große Probleme. Dennoch war die Atmosphäre bei meiner Ankunft angespannt. Mir war zu diesem Zeitpunkt noch nicht bewusst, wie sehr sich die Lage im Land zugespitzt hatte. Ich kehrte in ein Land zurück, das nach dem Krieg im Sommer nun im Inneren brannte; es war der zweite Tag der großen landesweiten Proteste.</p>
</section>
<section class="chapter" data-tense="past">
<h1>Im Vakuum des Blackouts</h1>
<p>Nach meiner Landung verbrachte ich zunächst ein paar Tage in Teheran, bevor ich mit dem Nachtzug nach Shiraz fuhr. Ich freute mich sehr auf die Rückkehr an diesen Ort, der für mich zu den liebsten im ganzen Land gehört. Das lag zum einen an der Freundschaft zum Gastgeber meines Hotels, zum anderen daran, dass ich dort endlich meinen Mercedes wieder in Empfang nehmen konnte. Jalal, seine Frau Zara und ihr Bruder Ali empfingen mich sehr herzlich in ihrem Zuhause. Es ist ein wunderschönes Haus im alten iranischen Stil mit bunten Fenstern, die zum grünen Innenhof ragen. Aufgrund der landesweiten Proteste blieb ich die meiste Zeit im Haus und ging fast nur zum Essen vor die Tür. Es herrschte eine familiäre Stimmung und ich verbrachte viel Zeit mit Gesprächen mit den anderen Gästen.</p>
<p>Da Razool für einige Tage auf einem VW Treffen in Buschehr war, musste ich etwas auf meinen Wagen warten. Als ich ihn schließlich abholte, war er unter einer dicken Staubschicht begraben. Ich setzte mich hinein und drehte den Schlüssel um. Der Wagen sprang sofort an, genau wie ich es gewohnt war. Auch wenn der Mercedes von außen und innen etwas heruntergerockt aussieht, läuft der Motor wie eine eins. Der Rost an einigen Stellen war über die Monate allerdings deutlich sichtbarer geworden. Da Reparaturen im Iran im Vergleich zu Deutschland extrem günstig sind, suchte ich über Razool nach einem Lackierer. Wir einigten uns auf einen Preis von etwa 200 Euro. Für diese Summe lackierte er die Heckklappe, die Motorhaube und mehrere kleine Stellen rund um das Auto. Außerdem flexte er eine alte Außensteckdose ab und schweißte ein neues Blech ein.</p>
<p>Die Wartezeit für die Lackierung war kein Problem, da ich ohnehin noch einmal nach Teheran musste. Mein russischer Pass lag beim Konsulat, das wegen des Neujahrsfestes bis zum 12. Januar geschlossen blieb. Bevor ich den Wagen beim Lackierer abgab, suchte ich stundenlang nach Winterreifen. Meine geplante Route sollte mich durch die Berge des kurdischen Teils Irans und später nach Armenien führen. Ich machte die Erfahrung, dass Sommerreifen dort definitiv keinen Spaß machen. Doch die Suche blieb erfolglos. Die Leute verstanden oft gar nicht, was ich suchte, oder boten mir Schneeketten an, die jedoch ebenfalls nicht verfügbar waren. Ich gab schließlich auf und brachte den Mercedes zum Lackierer.</p>
<p>Am Mittwoch, den 7. Januar, zeigte sich die Anspannung im Land deutlich. Ich wollte etwas zu essen finden, doch obwohl es ein normaler Wochentag war, hatten alle Geschäfte geschlossen. Es war ein beängstigendes Bild, aber gleichzeitig spannend zu sehen, wie stark die Bevölkerung durch diesen Boykott gegen das Regime zusammenhielt. Der wahre Schrecken folgte am nächsten Tag, als das Internet im gesamten Land einfach ausgeschaltet wurde. Zuerst dachte ich an eine kurze Unterbrechung über das Wochenende, doch ich irrte mich. Da nur noch nationale Webseiten funktionierten, konnte Jalal immerhin Zugtickets nach Teheran für mich buchen. Nachdem ich meinen Wagen am Freitag in tadellos lackiertem Zustand abgeholt hatte, machte ich mich am Sonntagabend mit dem Nachtzug auf den Weg in die Hauptstadt.</p>
<p>Am Montagmorgen kam ich in Teheran an und war der erste in der Schlange vor dem Konsulat. Dort teilte man mir mit, dass mein Pass zwar vorlag, ich ihn aber wegen des Blackouts eigentlich nicht erhalten könne, da die Abholung nach Moskau gemeldet werden müsse. Nach einer langen Diskussion hatte ich Glück, da ich zusätzlich mit meinem deutschen Pass reiste. Sie händigten mir das Dokument schließlich aus, warnten mich aber, dass der Pass im System erst aktiviert würde, sobald wieder Internet bestünde. Ich war erleichtert, denn ein neuer Pass wäre ein riesiger Aufwand gewesen und ich musste den Iran schnellstmöglich verlassen. Vor der Rückreise suchte ich noch die deutsche Botschaft auf. Ich hoffte verzweifelt auf einen Weg, meine Eltern zu erreichen, die zwar von meinem Aufenthalt im Iran wussten, aber vom plötzlichen Blackout völlig unvorhergesehen getroffen wurden. Es gab jedoch keine Möglichkeit für eine Verbindung nach außen.</p>

<p>Am nächsten Tag fuhren wir früh morgens zum Tazirat in Jolfa und dann weiter nach Khoy, wo Nasir bereits auf uns wartete. Dort gaben sie uns einen Brief für das Land-Department. Zurück beim Tazirat sagte man uns jedoch, dass das Land so nicht akzeptiert werden kann, weil es Ackerland und kein Bauland sei. Payam machte Witze darüber, dass es wohl wieder auf Samstag hinausläuft. Ich machte ihm klar, dass ich für solche Späße gerade wirklich nicht in der Stimmung war. Wir riefen Saleh an, dieser rief Scarface an, und dieser sprach mit meinem Richter. Wir kontaktierten den Anwalt, damit dieser ins Tazirat in Jolfa ginge, um der Sache nachzugehen. Er sagte, er sei eh in der Nähe und mache das direkt. Alles dauerte wieder eine gefühlte Ewigkeit. Ich musste wieder an Zahra denken, verwarf den Gedanken vorerst aber wieder. Der Anwalt rief zurück und sagte, der Assistent bleibe dabei: Bei solch einer Summe könne Ackerland nicht akzeptiert werden. Na toll... Wir riefen erneut den Anwalt an und sagten ihm, er solle persönlich mit dem Richter sprechen. Er willigte ein. Erneut verging eine Ewigkeit, bis der Rückruf kam: Das Ackerland wird als Kaution doch akzeptiert. Um 13:55 Uhr bekamen wir den neuen Brief fürs Land-Department. Da um 14 Uhr sämtliche staatlichen Einrichtungen schließen, konnten wir an diesem Tag nichts mehr erreichen.</p>
<p>Wir machten uns auf den Weg zu Nasirs eigentlicher Einkommensquelle. Er betreibt eine Art Badehaus in den Bergen kurz vor der türkischen Grenze. Dort wird Wasser aus heißen Quellen in große Becken hochgepumpt. Natürlich gibt es separate Männer- und Damen-Bäder. Wir entspannten uns einige Zeit im heißen Wasser und zogen uns danach in ein kleines Häuschen zurück, das Nasir uns dort zur Verfügung gestellt hatte. Neben einem Mitarbeiter waren Payam und ich die einzigen, die die Nacht dort verbrachten, weil es nachts in den Bergen einfach noch sehr kalt war. Ich platzierte meine dünne Matte direkt neben dem Heizstrahler, auf dessen anderer Seite Payam schlief. Anders wäre es eine wirklich ungemütlich kalte Nacht geworden.</p>

<p>An dieser Stelle muss ich eines ganz klar sagen: Alles, was mir dort widerfahren ist, lag in keiner Weise daran, dass ich Ausländer oder Tourist war. Die iranische Regierung geht mit ihrer eigenen Bevölkerung definitiv nicht glimpflicher um. Derzeit gibt es im Iran 25 Millionen offene Gerichtsverfahren bei einer Einwohnerzahl von 93 Millionen Menschen. In Deutschland sind es zum Vergleich nur etwa eine Million Verfahren. Die Diskrepanz zwischen der Bevölkerung und dem Staat ist in kaum einem anderen Land größer. Während der Staat sich als islamisch definiert, versteht sich die Bevölkerung primär als Perser. Das Verhältnis liegt schätzungsweise bei 20 zu 80 Prozent.</p>
<p>Für die meisten Menschen bleibt es unverständlich, warum ich überhaupt in den Iran reise. Doch der Hauptgrund sind die wundervollen Menschen dort. Die jahrtausendealte Kultur bietet eine Form des Miteinanders, die in westlichen Kulturen oft verloren gegangen ist. Während man hier, besonders in den anonymen Großstädten, oft das Gefühl hat, dass jeder nur in Ruhe gelassen werden will, zählt dort das Kollektiv. Wenn jemand nach Hilfe fragt, ist es für die Iraner selbstverständlich, ihn nicht nur zu unterstützen, sondern ihn vielleicht sogar direkt nach Hause einzuladen. Ein Gast ist dort ein Geschenk, keine Bürde. Selbst wenn sich jemand vordrängelt, regt sich niemand auf; man akzeptiert einfach, dass er es wohl eilig hat.</p>
<p>Diese Kultur wird von Feinheiten getragen, die mich als Mensch nachhaltig bereichert haben. Viele dieser Verhaltensmuster sind uns fremd, allen voran das Prinzip des Taarof, was man frei mit Höflichkeit übersetzen könnte. Während wir dieses Wort in Deutschland oft nur beiläufig nutzen, ist es in der persischen Kultur ein echtes Leitmotiv. Auch wenn es manchmal anstrengend sein kann, wenn sich auf einer überfüllten Treppe alle gegenseitig den Vortritt lassen wollen, hat diese Art zu leben etwas sehr Schönes.</p>
<p>Payams Rolle in meiner Geschichte steht stellvertretend für dieses Herz. Er hat mir in einer Weise geholfen, wie es kaum ein anderer tun würde, ohne jemals eine Gegenleistung zu erwarten. Überlegt euch bitte selbst, wie viele Menschen in eurem eigenen Umfeld einem völlig Fremden so bedingungslos beistehen würden.</p>
<p>Doch trotz aller Gastfreundschaft ist es für iranische Händler derzeit extrem schwer, Geschäfte im Ausland zu tätigen. Payam sucht händeringend nach Partnern für den Export verschiedenster Waren. Besonders im Lebensmittelbereich lassen sich derzeit Deals realisieren, die für beide Seiten lukrativ sind, da die iranische Währung extrem günstig steht. Falls bei euch Interesse an einer professionellen Zusammenarbeit besteht, meldet euch gerne bei mir.</p>
<p>Bei der derzeitigen Lage weiß ich ehrlich gesagt noch nicht, ob ich das Auto wirklich bald abholen kann, aber ich werde es euch auf jeden Fall wissen lassen!</p>
