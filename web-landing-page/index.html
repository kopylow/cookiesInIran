<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="turnstile-site-key" content="0x4AAAAAADUbbZ-uk9W5i55a">
    <title>Kekse im Iran</title>
    <!-- Google Fonts: IBM Plex Sans & IBM Plex Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Arabic:wght@400;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body data-theme="light" data-state="past">

    <!-- Smart Top Bar -->
    <header id="top-bar">
        <div class="top-bar-left">
            <div id="book-title" class="nav-btn">Kekse im Iran</div>
        </div>
        <div class="top-bar-center">
            <button id="btn-comments" class="nav-btn">Comments</button>
            <button id="btn-support" class="nav-btn">Support</button>
            <button id="btn-contact" class="nav-btn">Contact</button>
        </div>
        <div class="top-bar-right">
            <select id="lang-toggle" aria-label="Change language">
                <option value="de" selected>DE</option>
                <option value="en">EN</option>
                <option value="ru">RU</option>
            </select>
            <button id="theme-toggle" aria-label="Toggle Dark/Light Mode">◑</button>
        </div>
    </header>

    <!-- Mobile Bottom Bar -->
    <nav id="bottom-bar" class="mobile-only">
        <button id="btn-comments-mobile" class="nav-btn">Comments</button>
        <button id="btn-support-mobile" class="nav-btn">Support</button>
        <button id="btn-contact-mobile" class="nav-btn">Contact</button>
    </nav>

    <!-- Progress Indicator -->
    <div id="progress-indicator"></div>

    <!-- Mechanical Drawers -->
    <div id="drawer-comments" class="drawer fullscreen">
        <div class="drawer-header">
            <h2>Comments</h2>
            <button class="close-drawer" aria-label="Close drawer">×</button>
        </div>
        <div class="drawer-content">
            <p>Discussion thread for the current chapter...</p>
        </div>
    </div>

    <div id="drawer-support" class="drawer fullscreen">
        <div class="drawer-header">
            <h2>Support</h2>
            <button class="close-drawer" aria-label="Close drawer">×</button>
        </div>
        <div class="drawer-content">
            <p>Support / Donations content goes here...</p>
        </div>
    </div>

    <div id="drawer-contact" class="drawer fullscreen">
        <div class="drawer-header">
            <h2>Contact</h2>
            <button class="close-drawer" aria-label="Close drawer">×</button>
        </div>
        <div class="drawer-content">
            <p>Contact information goes here...</p>
        </div>
    </div>

    <div id="drawer-overlay"></div>

    <!-- Lightbox for Photos -->
    <div id="lightbox" aria-hidden="true">
        <button id="lightbox-close" aria-label="Close lightbox">&times;</button>
        <img src="" alt="Full size photo">
    </div>

    <div id="page-wrapper">
        <!-- Cinematic Digital Cover -->
        <div id="hero">
            <div class="hero-content">
                <h1>Kekse im Iran</h1>
                <p class="subtitle">Anton Kopylow</p>
            </div>
        </div>

        <!-- Main Content -->
        <main id="main-content">
            <article id="manuscript-container">
                <!-- Dynamically loaded HTML fragments go here -->
                <div class="loading">Loading manuscript...</div>
            </article>
        </main>
    </div>

    <script src="comments.js"></script>
    <script src="main.js"></script>
</body>
</html>
