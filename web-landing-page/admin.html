<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kommentar-Admin · Kekse im Iran</title>
<style>
  :root { color-scheme: light dark; --pad: 1rem; --gap: 0.5rem; --accent: #0060df; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 1100px; margin: 0 auto; padding: var(--pad); }
  h1 { margin: 0 0 1rem; font-size: 1.4rem; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; margin-bottom: 1.5rem; border-bottom: 2px solid currentColor; }
  .tab { padding: 0.5rem 1.2rem; cursor: pointer; border: none; background: none; font-size: 1rem; opacity: 0.55; border-bottom: 3px solid transparent; margin-bottom: -2px; }
  .tab.active { opacity: 1; border-bottom-color: var(--accent); font-weight: 600; }
  .panel { display: none; }
  .panel.active { display: block; }

  /* Filters */
  .filters { display: flex; gap: var(--gap); margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
  .filters select, .filters input { padding: 0.35rem 0.5rem; font-size: 0.9rem; }
  .filters label { display: flex; align-items: center; gap: 0.3rem; font-size: 0.9rem; }

  /* Cards */
  .card { border: 1px solid rgba(127,127,127,0.35); border-radius: 8px; padding: var(--pad); margin-bottom: var(--gap); }
  .card.status-hidden { opacity: 0.6; }
  .card.status-deleted { opacity: 0.35; }
  .meta { font-size: 0.8rem; opacity: 0.7; margin-bottom: 0.4rem; }
  .meta strong { opacity: 1; }
  .body { white-space: pre-wrap; padding: 0.5rem; background: rgba(127,127,127,0.1); border-radius: 4px; margin: 0.5rem 0; font-size: 0.95rem; }
  .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.5rem; }
  .badge { display: inline-block; font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 4px; border: 1px solid currentColor; vertical-align: middle; margin-left: 0.3rem; }
  .badge.verified { color: #0a7; border-color: #0a7; }
  .badge.hidden { color: #c80; border-color: #c80; }
  .badge.deleted { color: #c00; border-color: #c00; }

  /* Buttons */
  button { padding: 0.35rem 0.75rem; cursor: pointer; font-size: 0.9rem; border-radius: 4px; border: 1px solid currentColor; background: none; }
  button:disabled { opacity: 0.4; cursor: default; }
  button.danger { color: #b00; }
  button.primary { color: var(--accent); border-color: var(--accent); }

  /* Pagination */
  .pagination { display: flex; gap: var(--gap); align-items: center; margin-top: 1rem; }

  /* Status bar */
  #empty-comments, #empty-reports { padding: 2rem; text-align: center; opacity: 0.6; display: none; }
  #error { background: rgba(200,0,0,0.1); color: #c00; padding: 0.5rem 1rem; border-radius: 4px; margin-bottom: 1rem; display: none; border: 1px solid #c00; }

  /* Login gate */
  #login-overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: Canvas; z-index: 1000; padding: var(--pad); }
  #login-overlay.hidden { display: none; }
  .login-box { width: 100%; max-width: 340px; border: 1px solid rgba(127,127,127,0.35); border-radius: 8px; padding: 1.5rem; }
  .login-box h2 { margin: 0 0 1rem; font-size: 1.2rem; }
  .login-box input { width: 100%; padding: 0.55rem 0.6rem; font-size: 1rem; margin-bottom: 0.75rem; border-radius: 4px; border: 1px solid rgba(127,127,127,0.5); background: none; color: inherit; }
  .login-box button { width: 100%; }
  #login-error { color: #c00; font-size: 0.85rem; margin-top: 0.6rem; min-height: 1.1em; }
  #logout { float: right; font-size: 0.85rem; }
</style>
</head>
<body>

<!-- ── LOGIN GATE ── -->
<div id="login-overlay" class="hidden">
  <form class="login-box" id="login-form" autocomplete="on">
    <h2>Admin-Login</h2>
    <input type="password" id="login-pw" placeholder="Admin-Passwort" autocomplete="current-password">
    <button type="submit" class="primary" id="login-btn">Anmelden</button>
    <div id="login-error"></div>
  </form>
</div>

<h1>Kommentar-Admin <button id="logout">Abmelden</button></h1>
<div style="margin-bottom: 1rem;">
  <label style="font-size: 0.9rem; display: flex; align-items: center; gap: 0.4rem; opacity: 0.8;">
    <input type="checkbox" id="skip-confirm">
    Ohne Bestätigungs-Dialoge arbeiten (Löschen, DSGVO, Sperren direkt ausführen)
  </label>
</div>
<div id="error"></div>

<div class="tabs">
  <button class="tab active" data-tab="comments">Alle Kommentare</button>
  <button class="tab" data-tab="reports">Meldungen</button>
</div>

<!-- ── COMMENTS TAB ── -->
<div id="panel-comments" class="panel active">
  <div class="filters">
    <select id="c-lang">
      <option value="">Alle Sprachen</option>
      <option value="de">DE</option>
      <option value="en">EN</option>
      <option value="ru">RU</option>
    </select>
    <select id="c-status">
      <option value="">Alle Status</option>
      <option value="visible">Sichtbar</option>
      <option value="hidden">Versteckt</option>
      <option value="deleted">Gelöscht</option>
    </select>
    <input id="c-thread" type="text" placeholder="Thread-ID (z.B. ch:3:de)" style="width:180px">
    <button id="c-load" class="primary">Laden</button>
    <button id="c-refresh">↺</button>
  </div>
  <div id="comments-list"></div>
  <div id="empty-comments">Keine Kommentare gefunden.</div>
  <div class="pagination">
    <button id="c-prev" disabled>← Zurück</button>
    <button id="c-next" disabled>Weiter →</button>
  </div>
</div>

<!-- ── REPORTS TAB ── -->
<div id="panel-reports" class="panel">
  <div class="filters">
    <label><input type="checkbox" id="show-resolved"> Auch erledigte Meldungen zeigen</label>
    <button id="r-refresh">↺</button>
  </div>
  <div id="reports-list"></div>
  <div id="empty-reports">Keine offenen Meldungen.</div>
</div>

<script src="admin.js"></script>
</body>
</html>
