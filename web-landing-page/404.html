<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Cookies in Iran</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #f7f5f0;
            color: #1a1a1a;
            font-family: Georgia, 'Times New Roman', serif;
            padding: 2rem;
            text-align: center;
        }

        @media (prefers-color-scheme: dark) {
            body { background-color: #1e1e1e; color: #f0ecd8; }
            a { color: #d4a373; }
            a:hover { color: #b5651d; }
        }

        .code {
            font-size: clamp(4rem, 20vw, 8rem);
            font-weight: bold;
            letter-spacing: -0.02em;
            opacity: 0.15;
            line-height: 1;
            margin-bottom: 1.5rem;
        }

        .message {
            font-size: clamp(1rem, 3vw, 1.4rem);
            font-style: italic;
            max-width: 30ch;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            opacity: 0.8;
        }

        a {
            color: #b5651d;
            text-decoration: none;
            font-size: 0.95rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            border-bottom: 1px solid currentColor;
            padding-bottom: 2px;
        }

        a:hover { opacity: 0.7; }
    </style>
</head>
<body>
    <div class="code">404</div>
    <p class="message">This road doesn't exist.<br>Fortunately, the one through Iran does.</p>
    <a href="/">Back to the beginning</a>
</body>
</html>
